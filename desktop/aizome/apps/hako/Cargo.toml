[package]
name = "aizome-hako"
description = "Hako 箱 (Files): Aizome's file manager, with Miller columns, the Trash, and file operations that lose nothing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hako"
path = "src/lib.rs"

[[bin]]
name = "aizome-hako"
path = "src/main.rs"

[features]
default = ["gui"]
# The window. Without it the file operations, the Trash, MIME types and
# thumbnails build with no toolkit at all.
gui = ["dep:aizome-kit", "dep:aizome-sys", "dep:aizome-ipc", "dep:aizome-search", "dep:aizome-config", "dep:sidestep-engine", "dep:zbus"]
# `fsops::JobKey::for_tests`: a job's key for tests of operations outside the
# window. Only the dev-dependency on this package below turns it on.
test-util = []

[dependencies]
aizome-kit = { workspace = true, optional = true }
aizome-sys = { workspace = true, optional = true }
aizome-ipc = { workspace = true, optional = true }
aizome-search = { workspace = true, optional = true }
aizome-config = { workspace = true, optional = true }
# The typestate support Sekka's machines share (the transfer, Trash and
# undo protocols in src/fsops).
aizome-typestate = { path = "../../crates/aizome-typestate" }
# The clipboard in file managers' types (see src/ui/clipboard.rs): the engine
# under sidestep-ui, by the same path the workspace takes it.
sidestep-engine = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
env_logger.workspace = true
libc = "0.2"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }
# Thumbnails' file names (the freedesktop spec's MD5 of the URI) and their
# PNGs' text chunks.
md5 = "0.8"
png = "0.18"

[dev-dependencies]
# Agreements as if a person had pressed Replace, and harness presses that
# make them (the kit's `testing`; never in the app's own build).
aizome-kit = { workspace = true, features = ["testing"] }
# Itself, with test-util, for the integration tests that replace.
aizome-hako = { path = ".", features = ["test-util"] }
