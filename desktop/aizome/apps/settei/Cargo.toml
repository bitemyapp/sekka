[package]
name = "aizome-settei"
description = "Settei 設定 (Settings): Aizome's System Settings, a sidebar of panes and forms that change the desktop at once"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "settei"
path = "src/lib.rs"

[[bin]]
name = "aizome-settei"
path = "src/main.rs"

[dependencies]
aizome-kit.workspace = true
aizome-theme.workspace = true
aizome-config.workspace = true
aizome-ipc.workspace = true
aizome-sys.workspace = true
aizome-search.workspace = true
aizome-awake = { path = "../../crates/aizome-awake" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
env_logger.workspace = true
libc = "0.2"
