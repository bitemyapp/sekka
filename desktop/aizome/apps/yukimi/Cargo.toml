[package]
name = "aizome-yukimi"
description = "Yukimi 雪見, Sekka's Nix software manager, made native for Aizome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aizome-yukimi"
path = "src/main.rs"

[dependencies]
aizome-kit.workspace = true
aizome-theme.workspace = true
# Both interfaces use Sekka's canonical UI-independent Yukimi libraries.
yukimi-config = { path = "../../../../apps/yukimi/crates/yukimi-config" }
yukimi-store = { path = "../../../../apps/yukimi/crates/yukimi-store", features = ["bundled"] }
yukimi-system = { path = "../../../../apps/yukimi/crates/yukimi-system" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
libc = "0.2"
