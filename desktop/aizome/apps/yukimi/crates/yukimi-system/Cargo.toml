[package]
name = "yukimi-system"
description = "A NixOS system as a person sees it: generations, profiles, what changed, what is available, and progress while Nix works"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Copied from Sekka's Yukimi (apps/yukimi/crates/yukimi-system), with its
# dependencies named here instead of in Sekka's workspace.
[dependencies]
yukimi-store = { path = "../yukimi-store" }
yukimi-config = { path = "../yukimi-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
# Asking GitHub and FlakeHub for the newest version of a source.
ureq = "3"
