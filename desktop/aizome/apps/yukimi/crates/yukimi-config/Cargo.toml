[package]
name = "yukimi-config"
description = "Read and edit NixOS configuration files without disturbing them, and read flake.lock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Copied from Sekka's Yukimi (apps/yukimi/crates/yukimi-config), with its
# dependencies named here instead of in Sekka's workspace.
[dependencies]
rnix = "0.14"
# rnix's syntax trees; the version rnix itself uses, for its `AstNode` trait.
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
