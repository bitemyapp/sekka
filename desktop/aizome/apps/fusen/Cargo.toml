[package]
name = "aizome-fusen"
description = "Fusen 付箋, Aizome's notes: Markdown files in ~/Notes, a list with search, colours, and stickies that float"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aizome_fusen"
path = "src/lib.rs"

[[bin]]
name = "aizome-fusen"
