[dependencies]
aizome-kit.workspace = true
aizome-ipc.workspace = true
aizome-sumi = { path = "../sumi" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
ropey = "1.6"
libc = "0.2"
