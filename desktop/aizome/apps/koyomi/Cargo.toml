[package]
name = "aizome-koyomi"
description = "Koyomi 暦, Aizome's calendar: month, week, day and year views over iCalendar files, with an alert agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "koyomi"
path = "src/lib.rs"

[[bin]]
name = "aizome-koyomi"
path = "src/main.rs"

[dependencies]
aizome-kit.workspace = true
aizome-theme.workspace = true
aizome-config.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
env_logger.workspace = true
libc = "0.2"
# Civil dates, instants and time zones (IANA from the system's zoneinfo,
# with a bundled copy when a system has none, and POSIX rules for the
# VTIMEZONEs Outlook writes).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# The alert agent posts notifications with actions and hears them.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
