[package]
name = "aizome-remote-protocol"
description = "Bounded retained-paint wire format for optional Aizome remote desks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
client = ["dep:wayland-client", "dep:wayland-scanner"]
server = ["dep:wayland-server", "dep:wayland-scanner"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
wayland-client = { version = "0.31", optional = true }
wayland-server = { version = "0.31", optional = true }
wayland-scanner = { version = "0.31", optional = true }
