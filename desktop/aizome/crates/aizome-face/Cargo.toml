[package]
name = "aizome-face"
description = "Aizome's look over its kit: the mark, text specs, hard shadows, wallpapers ready to blit, and the drawn and field widgets the shell and the login screen share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aizome-kit.workspace = true
aizome-theme.workspace = true
# Reuse Sidestep's JPEG decoder without expanding full-size RGB photos to
# RGBA before scaling them down to the output size.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
