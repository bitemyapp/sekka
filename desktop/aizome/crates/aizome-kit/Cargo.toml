[package]
name = "aizome-kit"
description = "Aizome's widget kit, on Sidestep's native toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Agreements for tests (src/agree.rs): `agree::testing`, and harness
# presses that make them. Only tests' dev-dependencies turn it on.
testing = []

[dependencies]
aizome-theme.workspace = true
sidestep-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
ropey = "1.6"
unicode-segmentation = "1.12"
aizome-config.workspace = true
aizome-shell-proto = { path = "../aizome-shell-proto" }
libc = "0.2"
png = "0.18"

[dev-dependencies]
aizome-shell-proto = { path = "../aizome-shell-proto" }
