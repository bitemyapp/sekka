# xdg-desktop-portal in Aizome sessions: screenshots and screencasts through
# xdg-desktop-portal-wlr (the compositor speaks its ext-image-copy-capture,
# for displays and windows, and wlr-screencopy), everything
# else (files, settings, inhibit, accounts…) through the GTK portal, and
# secrets through GNOME Keyring.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
