# Aizome's terminal: foot in IBM Plex Mono with Aizome's Night and Day
# palettes (Tokyo Night, as Tatami's), installed as
# /etc/xdg/aizome/foot/foot.ini and read only in Aizome sessions. The shell
# selects Night or Day with SIGUSR1 and SIGUSR2 when a terminal opens,
# when the shell reconnects, and when the desktop theme changes.
[main]
term=xterm-256color
font=IBM Plex Mono:size=10.5
font-bold=IBM Plex Mono:weight=semibold:size=10.5
pad=12x10
initial-window-mode=windowed
initial-color-theme=dark
workers=0

[csd]
preferred=server

[scrollback]
lines=10000
multiplier=5.0

[cursor]
style=beam
beam-thickness=2
blink=no

[mouse]
hide-when-typing=yes

[key-bindings]
# Super is Aizome's command key; the compositor turns Super+C and Super+V
# into Control+Shift+C and +V for terminals, which these bind.
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n

[text-bindings]
# Shift+Return as CSI-u, so TUIs can tell it from Return.
\x1b[13;2u=Shift+Return

