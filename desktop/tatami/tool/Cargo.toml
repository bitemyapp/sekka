[package]
name = "tatami"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Session launcher and desktop commands for the Tatami session"
publish = false

[dependencies]
gdk-pixbuf = "=0.22.0"
libc = "=0.2.177"
serde_json = "=1.0.145"
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[[bin]]
name = "tatami"
path = "src/main.rs"

[profile.release]
opt-level = "s"
