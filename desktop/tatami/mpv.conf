# Keep hardware OpenGL available and permit its software fallback on machines
# without a 3D GPU. In mpv 0.41, rejecting llvmpipe can abort while trying X11
# contexts; lavapipe's Wayland Vulkan path can stall on its first frame.
# User mpv.conf and command-line options still override these system defaults.
gpu-api=opengl,vulkan
gpu-sw=yes
