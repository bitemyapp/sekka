# Tatami idle handling after Omarchy 4's idle service (MIT): lock
# after five minutes (config/omarchy/shell.json idle.lock = 300); the lock
# turns the displays off a few seconds later. Stay Awake stops this unit.
general {
    lock_cmd = tatami lock
    before_sleep_cmd = tatami lock --lock-only
    after_sleep_cmd = tatami wake 1
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = tatami lock
    on-resume = tatami wake
}
