# Tatami lock screen after Omarchy 4's lock view (shell/plugins/lock/
# LockView.qml with Tokyo Night's shell.lock.toml; MIT, see ../LICENSE):
# the background heavily blurred, and a centered 381x67 field with a 3px
# foreground outline over the background at 80%, "Enter Password" and dots.
$background = rgba(26,27,38, 1.0)
$field = rgba(26,27,38, 0.8)
$foreground = rgba(169,177,214, 1.0)

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $background
    # The background in use (Style › Background), asked of the helper.
    path =
    reload_cmd = tatami background path
    blur_passes = 4
    blur_size = 12
    noise = 0
    contrast = 0.92
    brightness = 1.0
    vibrancy = 0
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 381, 67
    position = 0, 0
    halign = center
    valign = center

    inner_color = $field
    outer_color = $foreground
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_color = $foreground

    placeholder_text = Enter Password
    check_color = $foreground
    fail_color = $foreground
    fail_text = <i>$FAIL</i>

    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
