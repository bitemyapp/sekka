# Capture › in the Tatami menu (see tatami.toml).
name = "tatami-capture"
name_pretty = "Capture"
parent = "tatami-trigger"
fixed_order = true
hide_from_providerlist = true
action = "%VALUE%"

[[entries]]
text = "Screenshot"
icon = "\uF030"
value = "tatami screenshot"

[[entries]]
text = "Screenrecord"
icon = "\uF03D"
