state = ["submenu"]
keywords = ["record", "video", "screencast"]

[[entries]]
text = "Text"
icon = "󰴑"
value = "tatami capture text"
keywords = ["ocr"]

[[entries]]
text = "QR Code"
icon = "󰐲"
value = "tatami capture qr"
keywords = ["qr", "barcode"]

[[entries]]
text = "Color"
icon = "󰃉"
value = "tatami color-picker"
