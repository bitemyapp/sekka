[package]
name = "tatami-sound"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The Sound window of the Tatami session"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
serde_json = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# The level meter: peak detection, which pactl has no stream for.
libpulse-binding = "2.30"

[[bin]]
name = "tatami-sound"
path = "src/main.rs"

[profile.release]
opt-level = "s"
