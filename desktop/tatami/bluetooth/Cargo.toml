[package]
name = "tatami-bluetooth"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The Bluetooth window of the Tatami session"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }

[[bin]]
name = "tatami-bluetooth"
path = "src/main.rs"

[profile.release]
opt-level = "s"
