[package]
name = "bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Every crate slot is a feature, all on by default. While slots are being
# written in parallel, build only yours: `--no-default-features --features <crate>`
# (a slot that is off is skipped, as if not implemented).
default = ["all"]
all = ["statig", "smlang", "sml", "finny", "fsmentry", "statum", "state-machines", "rust-fsm"]
statig = ["dep:impl-statig"]
smlang = ["dep:impl-smlang"]
sml = ["dep:impl-sml"]
finny = ["dep:impl-finny"]
fsmentry = ["dep:impl-fsmentry"]
statum = ["dep:impl-statum"]
state-machines = ["dep:impl-state-machines"]
rust-fsm = ["dep:impl-rust-fsm"]
# Instruction counts with gungraun (formerly iai-callgrind): needs valgrind
# and the matching `gungraun-runner` (see IMPLEMENTING.md).
iai = ["dep:gungraun"]

[dependencies]
spec = { workspace = true, features = ["testing"] }
impl-implicit.workspace = true
impl-enum.workspace = true
impl-typestate.workspace = true
impl-statig = { workspace = true, optional = true }
impl-smlang = { workspace = true, optional = true }
impl-sml = { workspace = true, optional = true }
impl-finny = { workspace = true, optional = true }
impl-fsmentry = { workspace = true, optional = true }
impl-statum = { workspace = true, optional = true }
impl-state-machines = { workspace = true, optional = true }
impl-rust-fsm = { workspace = true, optional = true }
gungraun = { version = "=0.20.0", optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "machines"
harness = false

[[bench]]
name = "instructions"
harness = false
required-features = ["iai"]
