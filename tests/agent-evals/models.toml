size_gb = 12.1
engine = "llama.cpp"
vision = false
coords = "pixel"
license = "Apache-2.0"
# The harmony format keeps reasoning between tool calls.
keep_reasoning = true
params = { temperature = 1.0, top_p = 1.0, chat_template_kwargs = { reasoning_effort = "medium" } }

