[models."nemotron-3.5-bolt"]
# KV for all slots together: what fits beside the weights in 32 GB.
total_ctx = 131072
repo = "nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF"
revision = "e0fecb69cb3e5e4c5e8a056fa2aec98c78e91246"
