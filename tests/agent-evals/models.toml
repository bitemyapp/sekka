# Open models for the agent evaluations, and how to serve each on one
# RTX 5090 (32 GB). Revisions are pinned; sizes are the Hugging Face API's.
# serve.py downloads to ${SEKKA_MODELS:-~/.cache/sekka-models}/<name>/.
#
# engine: llama.cpp (llama-server from nix/local-models.nix), vllm or
#   sglang (their pinned upstream containers).
# vision: the model takes screenshots (computer use in screenshot mode).
# coords: how it gives screen points: norm1000 (0–1000 on each axis, as
#   Qwen3.x-VL and Holo4 are trained), norm1 (0–1) or pixel.
# params: request fields sent with every chat request.
# args: extra server arguments.
# total_ctx: llama.cpp KV tokens shared by all slots (q8_0), when the
#   default (slots × context) wouldn't fit beside the weights.

[models."qwen3.8-27b"]
# KV for all slots together: what fits beside the weights in 32 GB.
total_ctx = 131072
repo = "unsloth/Qwen3.8-27B-GGUF"
revision = "4ca720788d1e01f1bff70c033e0d0028fd02e502"
file = "Qwen3.8-27B-UD-Q6_K.gguf"
mmproj = "mmproj-F16.gguf"
size_gb = 22.9
engine = "llama.cpp"
vision = true
coords = "norm1000"
license = "Apache-2.0"
# The UD-Q6_K file carries the MTP head (blk.64.nextn): self-speculation.
args = ["--spec-type", "draft-mtp", "--spec-draft-n-max", "2"]
params = { temperature = 0.6, top_p = 0.95, top_k = 20, presence_penalty = 0.0 }

[models."qwen3.8-27b-nvfp4"]
# The same model for vLLM, to compare runtimes; not a separate candidate.
repo = "unsloth/Qwen3.8-27B-NVFP4"
revision = "f0b7c9e722f5565102fff8481c99e4d86ae099c7"
size_gb = 23.4
engine = "vllm"
vision = true
coords = "norm1000"
license = "Apache-2.0"
args = ["--kv-cache-dtype", "fp8", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder",
        "--reasoning-parser", "qwen3", "--speculative-config", '{"method":"mtp","num_speculative_tokens":2}']
params = { temperature = 0.6, top_p = 0.95, top_k = 20 }

