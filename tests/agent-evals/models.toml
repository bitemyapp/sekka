# Models for an 8 GiB GPU (docs/agent-evals: the 8 GiB round). Quality is
# the same at any slot count, so the episodes run with more slots on a
# bigger GPU; `args_8gib` is the single-user server that fits in 8 GiB of
# VRAM with 32K of context (q8_0 KV), measured on its own. Mixture-of-
# experts models keep some experts in system RAM there (-ncmoe).

