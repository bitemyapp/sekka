[package]
name = "sekka-discord"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.100"
axum = "=0.8.6"
chrono = "=0.4.42"
diesel = { version = "=2.3.4", features = ["sqlite"] }
diesel_migrations = "=2.3.0"
hex = "=0.4.3"
hmac = "=0.12.1"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["service", "tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
http-body = "=1.1.0"
parking_lot = "=0.12.5"
