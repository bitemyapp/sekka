name: Check and cache nightly Sekka

on:
  schedule:
    # 4 AM in Chicago, through daylight saving changes.
    - cron: '0 4 * * *'
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sekka-nightly
  cancel-in-progress: false

jobs:
  nightly:
    # Scheduled, or started by hand, from main only. It runs on the sandboxed
    # builder (nix/runner.nix and DEVELOPERS.md), one fresh container per
    # job, with Nix through the host's daemon. The environment holds the
    # binary-cache token and signing key, for main alone. It neither builds
    # nor publishes ISOs: no check uses the image, and an ISO is built and
    # published only on a workstation, after testing that exact image.
    #
    # It brings Sekka's inputs up to date, then checks that revision. Only
    # when everything passed and Sekka's packages are in the binary cache
    # does it commit the update to main, move the nightly branch (which
    # installed systems follow) to it.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, sekka-builder]
    timeout-minutes: 720
    environment: nightly
    env:
      # Avoid repeated full-heap GC in the large NixOS evaluations. The job
      # container has 64 GiB; start Nix's heap at 32 GiB (DEVELOPERS.md).
      GC_INITIAL_HEAP_SIZE: "34359738368"
    permissions:
      contents: write
    steps:
      - name: Check the cache secrets
        shell: bash
        env:
          CACHE_R2_ACCESS_KEY_ID: ${{ secrets.CACHE_R2_ACCESS_KEY_ID }}
          CACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.CACHE_R2_SECRET_ACCESS_KEY }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
        run: |
          # Fail now rather than after hours of building (DEVELOPERS.md).
          missing=()
          for name in CACHE_R2_ACCESS_KEY_ID CACHE_R2_SECRET_ACCESS_KEY CACHE_SIGNING_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::The nightly environment lacks ${missing[*]}."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Update Sekka's inputs
        shell: bash
        run: |
          set -euo pipefail
          nix flake update --flake . 2>&1 | tee "$RUNNER_TEMP/update.log"
          if ! git diff --quiet -- flake.lock; then
            {
              echo "Update Sekka's inputs for the nightly build"
              echo
              grep -E "^• Updated input" "$RUNNER_TEMP/update.log" | sed 's/^• /- /' || true
            } > "$RUNNER_TEMP/message"
            git -c user.name='Sekka nightly' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet --file "$RUNNER_TEMP/message" -- flake.lock
          fi
      - name: Check the builder
        shell: bash
        run: |
          set -euo pipefail
          nix --version
          # Report only protocol endpoint/version/trust, never environment or config.
          nix store info --store daemon --json | jq '{url, version, trusted}'
          # NixOS tests in the flake check run in VMs: a build that asks for
          # KVM must be able to open /dev/kvm, as QEMU will (see DEVELOPERS.md).
          # The ${...} in single quotes are Nix's own.
          # shellcheck disable=SC2016
          nix build --no-link --impure --print-build-logs --expr '
            let pkgs = (builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux;
            in pkgs.runCommand "kvm-${toString builtins.currentTime}" { requiredSystemFeatures = [ "kvm" ]; } "exec 3<>/dev/kvm && touch $out"
          ' || {
            echo "::error::The builder's Nix daemon cannot give builds KVM, which the NixOS tests need (see DEVELOPERS.md)."
            exit 1
          }
      - name: Build Uta
        shell: bash
        run: |
          set -euo pipefail
          # First, so a kit or Sukumo change that breaks Uta (see DEVELOPERS.md)
          # fails here by name. Nothing of Uta runs in this job, which goes on
          # to hold the cache's secrets: the flake check's uta-rustypipe runs
          # it in the build sandbox.
          nix build --no-update-lock-file --print-build-logs --no-link .#uta
      - name: Check components
        shell: bash
        run: |
          set -euo pipefail
          # Every check runs, rather than stopping at the first failure, and
          # the failed ones run once more: a VM test that loses a timing race
          # once must not hold back upstream security fixes for a day. A check
          # that fails twice still stops the update.
          if ! nix flake check --keep-going --no-update-lock-file --print-build-logs 2>&1 |
            tee "$RUNNER_TEMP/check.log"; then
            failed=$(sed -n 's/.*❌ \(checks\.[^ ]*\).*/\1/p' "$RUNNER_TEMP/check.log" | sort -u | paste -sd ' ')
            echo "::warning::Running failed checks once more: ${failed:-see the log above}. One that passes now is flaky; fix it."
            nix flake check --keep-going --no-update-lock-file --print-build-logs
          fi
          git diff --exit-code
      - name: Publish Sekka's packages to its binary cache
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_R2_SECRET_ACCESS_KEY }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          (umask 077 && printf '%s' "$CACHE_SIGNING_KEY" > "$config/cache.sekka.computer-1.sec")
          # The key stays on the container's /tmp, in memory; the signed
          # closures (many gigabytes) are staged on the runner's work volume.
          TMPDIR=$RUNNER_TEMP SEKKA_CACHE_CONFIG=$config nix run --no-update-lock-file .#push-cache
      - name: Check that updating to it only downloads
        shell: bash
        run: |
          set -euo pipefail
          # A fresh installed system, with any desktop and any free catalog
          # application, must find everything it needs in a cache: nothing
          # upstream publishes may make users compile.
          nix run --inputs-from . nixpkgs#python3 -- scripts/check_cache_coverage.py .#uta .#installed-systems
      - name: Move main and nightly to this revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # main has moved on during the build if this is refused; its next
          # nightly brings the inputs up to date on top of it.
          git push "$remote" HEAD:refs/heads/main ||
            echo "::warning::main moved during the build; the input update stays on nightly only."
          git push --force "$remote" HEAD:refs/heads/nightly
