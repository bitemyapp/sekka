[package]
name = "sekka-vpn-guard"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"
publish = false
description = "Blocks the address family a full-tunnel WireGuard connection does not carry"

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
netlink-packet-core = "=0.9.0"
netlink-packet-generic = "=0.5.0"
netlink-packet-route = "=0.34.0"
netlink-packet-wireguard = "=0.5.1"
netlink-sys = "=0.9.0"
ipnet = "2.11"
