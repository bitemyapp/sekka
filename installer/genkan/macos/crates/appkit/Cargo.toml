[package]
name = "sekka-mac-appkit"
description = "AppKit building blocks shared by Sekka Installer and its Recovery app: the crest, marks, the disk bar and view helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSTimer",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "NSValue",
    "NSAppleScript",
    "NSAppleEventDescriptor",
    "NSPathUtilities",
] }
objc2-app-kit = { workspace = true, features = [
    "block2",
    "objc2-core-foundation",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSActionCell",
    "NSClipView",
    "NSAccessibilityProtocols",
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSColorList",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSSecureTextField",
    "NSStackView",
    "NSStringDrawing",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSTrackingArea",
    "NSUserInterfaceLayout",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
