[package]
name = "genkan"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Genkan 玄関, Sekka's installer: its window, made with Aizome's kit"
publish = false

# The executable keeps the GTK interface's name: the desktop entry, the live
# media's autostart and the VM tests look for it.
[[bin]]
name = "calamares-nixos"
path = "src/main.rs"

[dependencies]
# The installer's backend: discovery, validation, the plan and the helper's
# session protocol. The privileged helper is built from it alone.
calamares-nixos = { path = "../rust" }
# Aizome's widget kit, on Sukumo (desktop/aizome/crates/aizome-kit), with
# the workspace's own manifest for the versions it inherits.
aizome-kit = { path = "../../../desktop/aizome/crates/aizome-kit" }
anyhow = "=1.0.100"
# Local times in the time zone being chosen, read from the media's tzdata.
jiff = "=0.2.38"
zeroize = "=1.8.2"

# tiny-skia's portable SIMD wraps 16-bit lanes on purpose (Aizome's and
# Sukumo's workspace manifests turn the same checks off).
[profile.dev.package.tiny-skia]
overflow-checks = false

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 4
