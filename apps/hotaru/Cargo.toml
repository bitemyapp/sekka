[workspace]
resolver = "3"
exclude = ["vendor/simdutf8"]
members = ["crates/hotaru-core", "crates/hotaru-io", "crates/hotaru-replay", "crates/hotaru-sprites"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/bitemyapp/sekka"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
