<!-- Yukimi: a round snow-viewing window onto a night sky, a snowflake, and a snowy ridge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14244a"/>
      <stop offset="0.5" stop-color="#2c4d93"/>
      <stop offset="0.8" stop-color="#5277c3"/>
      <stop offset="1" stop-color="#7ebae4"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7f7"/>
    </linearGradient>
    <clipPath id="window">
      <circle cx="64" cy="64" r="54"/>
    </clipPath>
    <g id="arm" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="0" y1="0" x2="0" y2="-26"/>
      <line x1="0" y1="-15" x2="-7" y2="-21"/>
      <line x1="0" y1="-15" x2="7" y2="-21"/>
    </g>
  </defs>
  <!-- The frame of the shōji window. -->
  <circle cx="64" cy="64" r="60" fill="#e9e1d1"/>
  <circle cx="64" cy="64" r="56" fill="#b8a98c"/>
  <g clip-path="url(#window)">
    <rect x="0" y="0" width="128" height="128" fill="url(#sky)"/>
    <!-- Falling snow. -->
    <g fill="#ffffff">
      <circle cx="30" cy="34" r="1.8" opacity="0.8"/>
      <circle cx="96" cy="28" r="2.2" opacity="0.7"/>
      <circle cx="22" cy="66" r="1.4" opacity="0.6"/>
      <circle cx="102" cy="60" r="1.6" opacity="0.8"/>
      <circle cx="44" cy="20" r="1.2" opacity="0.6"/>
      <circle cx="82" cy="16" r="1.5" opacity="0.7"/>
    </g>
    <!-- The snowflake. -->
    <g transform="translate(64 54)">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
      <circle r="3.5" fill="#ffffff"/>
    </g>
    <!-- Snow on the hills. -->
    <path d="M0 98 C 22 86, 40 90, 58 96 C 78 103, 96 88, 128 92 L 128 128 L 0 128 Z" fill="url(#snow)"/>
    <path d="M0 108 C 30 100, 52 108, 76 110 C 98 112, 112 104, 128 106 L 128 128 L 0 128 Z" fill="#c9daf2"/>
  </g>
  <!-- The window's lattice, faint. -->
  <g stroke="#e9e1d1" stroke-width="1.5" opacity="0.35" clip-path="url(#window)">
    <line x1="64" y1="8" x2="64" y2="120"/>
    <line x1="8" y1="64" x2="120" y2="64"/>
  </g>
</svg>
