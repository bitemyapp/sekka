[workspace]
resolver = "3"
members = [
    "crates/tasuke-models",
    "crates/tasuke-agent",
    "tasuke-cli",
    "tasuke-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitemyapp/sekka"
rust-version = "1.90"

[workspace.dependencies]
tasuke-models = { path = "crates/tasuke-models" }
tasuke-agent = { path = "crates/tasuke-agent" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"
ureq = "3"
sha2 = "0.10"
log = "0.4"

[profile.release]
lto = "thin"
