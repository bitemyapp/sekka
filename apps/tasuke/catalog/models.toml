# Tasuke's model catalog: the GGUF models Sekka's agent evaluations ran
# (docs/agent-evals/README.md, tests/agent-evals/models.toml), pinned to
# the same files. See catalog/README.md for what each field means and how
# the sizes, hashes, KV costs and compute buffers were obtained.

[reference]
gpu = "NVIDIA GeForce RTX 5090"
bandwidth_gb_s = 1792.0
evaluated = "2026-11-04"

# ---------------------------------------------------------------------------
# Curated defaults: what Tasuke suggests first, per role and memory budget
# (the largest GPU's memory × 0.92, less 1.5 GiB if it drives a display; or
# unified memory less 8 GiB). The highest tier the machine reaches applies.

[[default]]
role = "assistant"
min_budget_gib = 26.0
model = "gemma-4-31b"
why = "The curated choice for 32 GB GPUs: from Google, Apache-2.0, it fixed all 16 faults in oh-my-pi and 15 of 16 in the bare loop without damaging anything, and is the most economical of the strong models. Qwen3.8-27B scores as well and is faster."

[[default]]
role = "desktop"
min_budget_gib = 26.0
model = "qwen3.8-27b"
why = "The curated choice for desktop control on 32 GB GPUs: 16 of 18 desktop tasks and 30 of 31 faults with no damage in any episode. Qwen3.6-35B-A3B did all 9 desktop tasks and is faster, but twice ended the user's session to apply a fix."

[[default]]
role = "fast"
min_budget_gib = 26.0
model = "nemotron-3.5-bolt"
why = "The fast all-rounder without Chinese lineage: 88–93% of the faults, 7 of 9 desktop tasks and 153 tokens/s on an RTX 5090."

# From 8 GiB cards up (5.5 GiB of room once a display is driven) to 26 GiB.

[[default]]
role = "assistant"
min_budget_gib = 5.5
model = "gemma-4-26b-a4b"
why = "The curated choice below 32 GB: from Google, Apache-2.0, the best of the 8 GiB round (14 of 16 faults in the bare loop with nothing harmed, 13 of 16 in oh-my-pi). On an 8 GB card its experts partly live in system memory, which makes it slower but keeps its quality. Ornith 35B-A3B scores as well, from Qwen."

[[default]]
role = "desktop"
min_budget_gib = 5.5
model = "gemma-4-26b-a4b"
why = "The curated choice below 32 GB for desktop control: from Google, 5 of 9 desktop tasks from screenshots in pixel coordinates, more with Tasuke's numbered controls."

[[default]]
role = "fast"
min_budget_gib = 5.5
model = "gpt-oss-20b"
why = "The fast choice below 32 GB: from OpenAI, Apache-2.0, three quarters of the faults with nothing harmed, and quick even with some experts in system memory."

