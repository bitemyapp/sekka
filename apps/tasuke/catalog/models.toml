[models."qwen3.8-27b"]
name = "Qwen3.8 27B"
maker = "Alibaba (Qwen)"
lineage = ["Qwen (Alibaba)"]
origin = ["China"]
license = "Apache-2.0"
quant = "UD-Q6_K (unsloth)"
roles = ["assistant", "desktop"]
evaluated = true
architecture = { kind = "dense", params = 27 }
context = { default = 65536, max = 262144, min = 32768 }
kv = { per_token = 65536, recurrent_mib = 150 }
compute_buffer_mib = 900
vision = { coords = "norm1000" }
# The UD-Q6_K file carries the MTP head (blk.64.nextn): self-speculation,
# 1.7× faster single-stream decode with no extra download.
