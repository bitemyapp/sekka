[package]
name = "kakehashi-core"
description = "Drives, images, nightly builds and the write that Kakehashi's window and helper share"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# TLS for downloads: rustls on Linux; the system's own on macOS and Windows,
# with its certificate store and no C library to build.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
]

[dev-dependencies]
tempfile = "3"
