[package]
name = "kakehashi"
description = "Writes Sekka, or any disk image, to a USB drive and reads it back"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The dialog and the helper's start, as a library its doctests can reach;
# the window is the binary.
[lib]
name = "kakehashi_window"
path = "src/lib.rs"

[[bin]]
name = "kakehashi"
path = "src/main.rs"

[features]
# `dialog::Pressed::for_tests`: a press of OK for the window's own tests.
# Only the dev-dependency on this package below turns it on.
test-util = []

[dependencies]
kakehashi-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
gpui-kit = { version = "0.7.3", features = ["gpui-fast"] }
dirs = "6"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# Itself, with test-util, for the window's tests that press OK.
kakehashi = { path = ".", features = ["test-util"] }
