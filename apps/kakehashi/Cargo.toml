[workspace]
resolver = "3"
members = ["core", "helper", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitemyapp/sekka"
rust-version = "1.92"

[workspace.dependencies]
kakehashi-core = { path = "core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 16
