[package]
name = "sekka-download-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Lists the nightly builds on sekka.computer/download/: a Cloudflare Pages worker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The request handler, built for Pages with worker-build; the rendering
# above it is plain Rust, tested natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.5"
# Exactly the wasm-bindgen CLI that nix/site.nix builds with.
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# worker-build runs wasm-opt with --all-features, which lets Binaryen use
# Wasm features (compact imports) that Cloudflare's runtime refuses.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
